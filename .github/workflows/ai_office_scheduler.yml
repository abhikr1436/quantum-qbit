name: AI Office Background Runner

on:
  schedule:
    - cron: '0 * * * *' # Executes every 1 hour (hourly)
  workflow_dispatch:      # Allows manual trigger via web dashboard or GitHub UI

permissions:
  contents: write         # Allows the workflow to commit and push changes back to the repository

jobs:
  run-office-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install openai

      - name: Execute AI Office Cycle Loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/ai_office_runner.js

      - name: Commit and Push DB/Blog Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api/data/db.json public/api/data/blogs.json public/sitemap.xml
          git commit -m "AI Office: Automated content & task update" || echo "No changes to commit"
          git push origin master

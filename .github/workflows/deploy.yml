name: Build, Test, and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Deploy via FTP to Hostinger
        env:
          FTP_HOST_RAW: ${{ secrets.SFTP_SERVER }}
          FTP_USER: ${{ secrets.SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import ftplib, os, sys

          raw = os.environ['FTP_HOST_RAW']
          host = raw.split('//')[-1].split(':')[0].strip('/')
          user = os.environ['FTP_USER']
          pwd  = os.environ['FTP_PASS']

          print(f"Connecting to: {host}")
          ftp = ftplib.FTP()
          ftp.connect(host, 21, timeout=30)
          ftp.login(user, pwd)
          ftp.set_pasv(True)

          # --- Diagnose: list root directories ---
          print("\n=== FTP ROOT LISTING ===")
          ftp.retrlines('LIST')
          print("========================\n")

          # Try to list public_html contents
          try:
              ftp.cwd('public_html')
              print("=== public_html LISTING ===")
              ftp.retrlines('LIST')
              print("===========================\n")
              ftp.cwd('/')
          except Exception as e:
              print(f"public_html access error: {e}")

          def upload_dir(ftp, local_path, remote_path):
              try:
                  ftp.mkd(remote_path)
              except:
                  pass
              for item in sorted(os.listdir(local_path)):
                  lp = os.path.join(local_path, item)
                  rp = f"{remote_path}/{item}"
                  if os.path.isfile(lp):
                      with open(lp, 'rb') as f:
                          ftp.storbinary(f'STOR {rp}', f)
                      print(f'  uploaded: {rp}')
                  elif os.path.isdir(lp):
                      upload_dir(ftp, lp, rp)

          dist = os.path.join(os.getcwd(), 'dist')
          print(f"\nUploading from: {dist}")
          print(f"Files to upload: {sum(len(fs) for _,_,fs in os.walk(dist))}")

          upload_dir(ftp, dist, '/public_html')
          ftp.quit()
          print("\nDone!")
          PYEOF

name: Build, Test, and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Parse FTP Host
        id: parse-host
        run: |
          # Strip protocol prefix (e.g. ftp://) and trailing port if they exist
          HOST=$(echo "${{ secrets.SFTP_SERVER }}" | sed -e 's|^[^/]*//||' -e 's|:[0-9]*$||')
          echo "CLEAN_HOST=$HOST" >> $GITHUB_ENV
          echo "Resolved FTP host: $HOST"

      - name: Upload files via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CLEAN_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-sync-state.json

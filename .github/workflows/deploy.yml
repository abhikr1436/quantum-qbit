name: Build, Test, and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Deploy via FTP to Hostinger
        run: |
          # Install lftp
          sudo apt-get install -y lftp

          # Strip ftp:// prefix from host if present
          HOST=$(echo "${{ secrets.SFTP_SERVER }}" | sed -e 's|^[^/]*//||' -e 's|:[0-9]*$||')
          echo "Deploying to: $HOST"

          # Mirror local dist/ to remote public_html/
          # --reverse: local → remote
          # --delete: remove remote files not in local
          # --verbose: show what's being uploaded
          # --no-perms: skip permission sync (avoids Hostinger permission errors)
          lftp -u "${{ secrets.SFTP_USERNAME }}","${{ secrets.SFTP_PASSWORD }}" "ftp://$HOST" <<'FTPEOF'
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose --no-perms ./dist/ /public_html/
          bye
          FTPEOF

name: Build, Test, and Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Python dependencies
        run: pip install paramiko

      - name: Deploy via SFTP/FTP to Hostinger
        env:
          FTP_HOST_RAW: ${{ secrets.SFTP_SERVER }}
          FTP_USER: ${{ secrets.SFTP_USERNAME }}
          FTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: python scripts/ftp_deploy.py
